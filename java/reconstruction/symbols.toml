# NEVER resource content. Decompiled Java lives only under the git-ignored
# _reference/ tree.
#
# HOW NAMING WORKS (playbook: bytecode is the authority):
#   - The obfuscated `.class` bytecode is the sole source of truth.
#   - `name` is a reviewed, human-assigned semantic name. It is applied at
#     DECOMPILE TIME via a decompiler rename/mapping (e.g. jadx mappings),
#     NEVER by text-substituting decompiled output.
#   - Every `name` starts empty. Naming is EARNED by reading the class later;
#     do NOT invent semantic names here. `name = ""` means "not yet reviewed".
#
# FIELDS (per [[class]]):
#   obf        obfuscated simple name as it appears in the bytecode.
#   internal   JVM binary name (package/simple), the class's identity.
#   descriptor JVM class type descriptor (L<internal>;).
#   package    JVM package ("" = default package).
#   name       reviewed semantic name (TODO — assigned later, by review).
#   zero_twin  true iff this obf simple-name also occurs as a class in the
#              sibling heroes-lore-zero corpus. Twins are the shared rpg.*
#              engine surface; a non-twin is unique to Wind of Soltia.
#   members    (optional) reviewed member-name map for a NAMED class. Array of
#              inline tables { obf, descriptor, name }. Member identity is
#              (obf simple-name + JVM descriptor) EXACTLY as it appears in the
#              baseline bytecode (playbook R14 — verified with `javap -c -p -s`);
#              descriptors that reference still-obfuscated classes keep their obf
#              form (e.g. `(Lao;)Z`). `name = ""` = named later (see its # TODO).
#              Framework overrides (paint/keyPressed/startApp/…) keep the JVM name.
#              These names are the ones applied in the de-obfuscated crosswalk app
#              under java/src/main/java (bg->TitleScreen, ao->Hero, ae->GameMap,
#              ah->EventScript, rpg.GameMIDlet).
#
# PROVENANCE:
#   baseline  : _originals/Heroes-Lore-Wind-of-Soltia_J2ME_EN_v207.jar
#               (MIDlet-1 launcher rpg.GameMIDlet, 90 classes)
