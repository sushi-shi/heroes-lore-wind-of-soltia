review = "The front/start menu (bf / MainMenu extends Menu), crosswalked node-for-node (1463 Java / 1021 Rust nodes, each decided exactly once). This increment ports the fresh-install render + vertical-navigation path. STATE: the twelve MainMenu fields map to MainMenuState (the reference static singleton is a bool presence flag); the inherited Menu (cb) instance fields are carried as an embedded `base: menu::MenuBase` (representation-adapter — MainMenu has no Java field for it), and the two static initializers aboutIndex=5 / exitIndex=5 seed impl Default (whose other FIELD_INITs are the JVM implicit field defaults 0/false/null/empty, representation-adapter; the javac-folded <clinit> duplicate 5/5 at the class tail are erased). create() computes the centered panel origin (halfW-77, halfH-85, wrapping_sub) and builds the singleton via construct() (which folds super(null,(byte)6) into menu::construct(6)); the menuBuy itemCount++ uses wrapping_add. handleKey() ports the cursor navigation faithfully: passKeyToChild, moveCursorVertical, the !hasSave disabled-Load skip (cursorIndex +/- 1 via wrapping_add/wrapping_sub), and the logoFrame reset; the demoExpiry>0 demo buy/exit block collapses to `return true` (DEFERRED — demoExpiry is 0 on a fresh install), the keyCode==-8 exit popup's showPopup is DEFERRED (the pendingAction=2 is kept), and the FIRE-select switch into ClassSelectMenu/ContinueMenu/OptionsMenu/HelpMenu/AboutScreen/buy-popups is DEFERRED (target screens unported), the Rust returning false on that path (representation-adapter tail). draw() ports the demoExpiry<=0 branch (render + the three-frame logo intro, logoFrame+1 via wrapping_add); the demo trial-splash branch is DEFERRED and the branch-terminating `return;` is a faithful-noop (falling out of the if is equivalent, the splash being empty). PAINT (pixel-verified against the emulator): the parchment fill + drawMenuPanel + the sliding selection logo sprite + the six big-font item labels + the soft keys. Menu-layout arithmetic is realized genuinely: the centering `(x + (155 - w)) >> 1` and `(x + 155) >> 1` use j2me_jvm::ishr (the ONLY RIGHT_SHIFTs in any ported body, hence the only operator-parity nodes); cursorIndex*16 / item*16 / item*2 / 24*row / 24*contentRows use wrapping_mul, and every menu offset uses wrapping_add. The LCDUI Graphics parameter is materialised from the framebuffer via the j2me-me recorder (host-adapter); the read-only field snapshots taken for the disjoint &mut Game borrow are representation-adapter. drawMenuPanel draws the bordered atlas panel with rows+1 content rows through a hoisted `draw` closure that factors the menuFrames base and the constant 20 anchor (representation-adapter); the three column loops and the content-row loop lower to while. DEFERRED one-sided Java: the ctor demo-arm, onPopupResult, drawTitlePlate, the demo splash, the FIRE switch and the exit popup, plus javac field/local MODIFIERS. The port encodes only what MainMenu actually does — no emulator artefacts (e.g. no FreeJ2ME setColor latch)."
