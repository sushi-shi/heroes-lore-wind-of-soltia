review = "Shared direction lookup tables, crosswalked node-for-node (200 Java / 83 Rust nodes, each decided exactly once). This is a pure-constant Java `interface`: nine `public static final` arrays that every entity/menu class inherits. REPRESENTATION SHAPE (the dominant pattern here): each Java constant appears TWICE in the javac AST — once as the field declaration (VARIABLE + MODIFIERS + array/primitive type nodes + its `new …[]{…}` initializer) and once folded into the synthetic <clinit> (the bare initializer arrays, nodes 119-199). The Rust port materialises each as one module-level `pub const NAME: TYPE = […]`, whose name and type live OUTSIDE the syn initializer-body node inventory. So each op pairs the Java field-declaration's array initializer against the Rust const's ARRAY/LITERAL value nodes; the declaration shells (name + array/primitive TYPE nodes) and the entire folded <clinit> duplicate are one-sided Java nodes adapted as representation-adapter, and the `public static final` MODIFIERS plus the interface's SYNTHETIC_SUPER_CONSTRUCTOR marker are erased. Two faithful cross-language shapes are noted per-op: (1) Java `byte`/`byte[][]` becomes Rust `i8`/`[[i8;4];4]` — every value (10, 13, 6, 0, ±1 …) fits i8, so no truncation/defect; (2) a Java INT_LITERAL `-1` is a single node, realised in Rust as UNARY `-` applied to LITERAL `1` (DIR_DX/DIR_DY) — a representation difference, NOT an operator-parity construct (no DIVIDE/REMAINDER/shift exists anywhere in this body, `u.<clinit> => []`). The four `new byte[]` element-type PRIMITIVE_TYPE nodes inside elementDamageMultiplier's initializer are absorbed into its table op (Rust rows carry no element-type node)."
