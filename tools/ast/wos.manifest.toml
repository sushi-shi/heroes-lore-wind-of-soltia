review = "ByteUtil: big-endian byte helpers plus the shared RNG, crosswalked node-for-node (255 Java / 421 Rust nodes). This body is byte-packing/shift dense and the operator-realization teeth carry real weight: every Java LEFT_SHIFT (readU16 `<<8`; readS32 `<<24/<<16/<<8`) is realized on the Rust side by j2me_jvm::ishl, every RIGHT_SHIFT (writeI32 `>>24/>>16/>>8`) by j2me_jvm::ishr, and randRange's REMAINDER `%` by j2me_jvm::java_rem — each inside its own atomic op, no shape_note, no blanket. PRESERVED DEFECT represented honestly: writeI32's redundant `int v = value & (-1)` identity mask is kept verbatim as `let v: i32 = value & (-1)` (the `& -1` is a no-op the port does NOT simplify). readU16's redundant `0 | ...` is likewise preserved. The one piece of mutable state — `static Random rng = new Random()` — is modelled as `ByteUtilState.rng: JavaRandom`; the field decl and its construction pair to the Rust field + `ByteUtilState::seeded` (the JDK's time-seeded no-arg Random becomes an explicit-seed constructor for reproducibility, a representation note). The largest one-sided region is Rust-only host plumbing: the entire `JavaRandom` faithful reimplementation of java.util.Random (seed field, MULTIPLIER/ADDEND/MASK, new/next/next_int) and `java_math_abs` reimplementing Math.abs are host-adapters (those JDK facilities are not in the oracle) — their own internal shifts live in adapt, not in any paired op, while their call sites (rng.nextInt, Math.abs) pair inside rand_range. Java-only nodes are javac MODIFIERS metadata (erased) and the empty synthetic constructor (erased)."
