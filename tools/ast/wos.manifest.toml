review = "FontManager (obf `bh`), the text/label/font hub, crosswalked node-for-node over the boot/title slice (1411 Java / 814 Rust nodes, each decided exactly once). PORTED: initFonts (the six-font builder); fontForColor + drawChars/drawCharsCentered + stringWidth/lineHeight (the version/footer/menu draws — each Java `currentFont` reference-deref and `fontForColor` selection is realized through the CurrentFont enum + its `current_font(s)` resolver, and each null-checked font access by `as_ref().expect(..)`); getString (StringTable.get with `;`->`\n` realized by iter().map); the loadLabels boot subset (labelExit 3907, labelOk 3908, mainMenuLabels 3920..3926 with aastore[5]=3924 javap-verified, titleFooter 3950) folded into load_title_labels; setBigFont; drawMenuItem (RIGHT_SHIFT realized by ishr, REMAINDER by java_rem); drawSoftKeys (its arithmetic is only PLUS/MINUS, realized by wrapping_add/wrapping_sub). REPRESENTATION (Rust-only, one-sided): currentFont modeled as a CurrentFont enum + resolver fn; bigDefault aliases bigBlack (one Rust owner, fontForColor returns bigBlack for the default case); the 7 menu labels assembled into a Vec once; StringTable.load (deferred loadLanguage), versionText (deferred AppConfig.apply MIDlet-Version) and the menuBuyEnabled override are deferred cross-owner injections, with const APP_CONFIG_MENU_BUY_ENABLED snapshotting AppConfig.menuBuyEnabled=false. DEFERRED (erased, not ported in this boot slice): ~20 in-game label/cache statics and the methods clearScreen, requestBuyAndExit, percentOf, getStringChars, isSeparator/advanceWord/charsInLine/lineCount/measureBlockHeight/lineSpacing/blockHeightPx/wrapLines, the drawWrapped* family, charsToString, replaceAll, loadLocaleImage. Operator parity: the only DIVIDE/SHIFT/REMAINDER in the class are drawMenuItem's two `>>` (ishr) and one `%` (java_rem), both realized in their ops; percentOf's `/` sits in a DEFERRED (erased) method the slice never reaches."
