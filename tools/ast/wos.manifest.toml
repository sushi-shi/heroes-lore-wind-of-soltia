review = "The item-hierarchy root Item (ad) and the flattened Item struct, crosswalked node-for-node (1061 Java / 1373 Rust nodes, each decided exactly once). Java uses real inheritance (Item->Equipment->Armor->Weapon); the port flattens all four classes into ONE Item struct tagged by an ItemClass discriminant, so: the subclass instance fields (value..crit_bonus) are declared here as one-sided representation-adapters (their Java field decls live in the Equipment/Armor/Weapon bodies); the concrete-subclass switch(type) in create()/createFromBytes() is factored into the shared construct_for_type()/new_base() plus per-class new_weapon/new_armor/new_equipment/new_item wrappers (the construction path is one-sided here); the virtual parseRecord/serialize become explicit match dispatchers (parse_record/serialize, one-sided — Java dispatches dynamically at each call site, which DO pair); and instanceof Equipment/instanceof Armor become the is_equipment/is_armor helpers (their INSTANCE_OF operators pair at the deserialize call sites). NO divides or shifts anywhere: parsePrice packs the little-endian price with * 2^k (MULTIPLY -> wrapping_mul, NOT a shift — matching the imul opcode shape), every Java int + is realized by wrapping_add/wrapping_sub, and the name/description ASCII-decimal id fields keep their id chars via ascii_string_chars (the FontManager/StringTable/TextTable text resolution is DEFERRED, not ported in this slice). One-sided nodes: the deferred typeNames TextTable static + typeName() (erased-DEFERRED), all javac MODIFIERS (erased), the SYNTHETIC_SUPER_CONSTRUCTOR and the folded quantity=1 field initializer, the synthetic <clinit> array re-materialization and the createFromBytes switch duplicate (erased/representation), the trailing Vector.trimToSize() loop (faithful-noop — capacity-only), and the craft ingredients snapshot represented as (type,subId) tuples."
