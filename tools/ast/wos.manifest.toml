  { category = "erased", reason = "DEFERRED sibling method moveCursorHorizontal(action,keyCode) — left/right cursor navigation (keys 4/6) unused by the vertical main menu; not ported in this increment", java_range = [[185, 235]] },
  { category = "erased", reason = "DEFERRED sibling method moveCursor(direction) — `stepCursor(direction, true)` wrapper unused by the main menu (which calls stepCursor directly via moveCursorVertical); not ported in this increment", java_range = [[236, 241]] },
  { category = "erased", reason = "DEFERRED popup/close machinery: onPopupResult(tag,result), close(), showPopup(..)x2 and showMessage(lines) — all push/dismiss a PopupMenu child, which the fresh main-menu path never does (child stays null); not ported in this increment", java_range = [[349, 433]] },
  { category = "erased", reason = "DEFERRED sibling method invalidateUp() — walks parent links to mark ancestors dirty; the main menu is the root (parent null) and this is not on its reachable path; not ported in this increment", java_range = [[434, 451]] },
  { category = "erased", reason = "DEFERRED pagination + static draw-kit: currentPage/pageCount/pageFirstIndex/pageLastIndex, drawListPage, and the whole static draw kit (drawBevelOutline/fillInset1/drawBevelBox/fillInset2/fillOutlinedRect/drawPanelFrame/fillPanelInterior/drawTabButton/drawGold/drawItemIcon/drawItemInfo/drawQuickSlotRow/drawButton/drawSelectableBox/drawTextField/drawInsetPanel). MainMenu.paint draws through its OWN static drawMenuPanel + FontManager helpers, NOT this kit, so none of it is reached on the fresh main-menu path; not ported in this increment", java_range = [[470, 2126]] },
]

