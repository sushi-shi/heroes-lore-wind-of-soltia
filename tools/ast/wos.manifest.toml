  { category = "representation-adapter", reason = "the head=null / tail=null / count=0 field initializers — both the declaration-site (NULL_LITERAL/NULL_LITERAL/INT_LITERAL 0) and their <init>-folded copies — are materialized by #[derive(Default)] on EntityListState (head:None, tail:None, count:0), a derive macro with no AST node", java = [3, 7, 11, 13, 14, 15] },
  { category = "representation-adapter", reason = "EntityNode::next field decl (FIELD_DECL + Option<EntityId> + EntityId): a field of the not-ported Entity (ck), declared on the Rust-only EntityNode slab type; its reads/writes pair inside the method ops", rust = ["0:0", "0:1", "0:2"] },
  { category = "representation-adapter", reason = "EntityNode::prev field decl: an Entity field on the Rust-only EntityNode; reads/writes pair in the ops", rust = ["1:0", "1:1", "1:2"] },
  { category = "representation-adapter", reason = "EntityNode::half_h field decl (byte depth term): an Entity field on the Rust-only EntityNode; read via depth()", rust = ["2:0", "2:1"] },
