review = "AppConfig (w), the read-only JAD launch-config reader, crosswalked node-for-node (606 Java / 760 Rust nodes, every one decided exactly once). The static MIDlet midlet is modeled by app_properties: HashMap (its sole use is getAppProperty), and `AppConfig.midlet = midlet` is subsumed by that state (host-adapter); get_app_property, java_string_trim (String.trim) and java_index_of (String.indexOf) are Rust-only reimplementations of JDK/host boundaries whose call sites pair inside the methods (their definitions are representation-adapters). Null/empty property guards are realized as Option matches; the demo-token literal is hoisted to the DEMO_UNLOCK_TOKEN const. resolveBuyLabel is the arithmetic-bearing method: label.length()/substring run on a UTF-16 Vec, the \\u unescape loop's i+1/i+5/i-1 are realized by wrapping_add/wrapping_sub and (char) by `as u16` (i2c), Integer.parseInt by i32::from_str_radix, and the do-while continue test inverts into a trailing break. showDemoBuyLink's redundant `? false : true` idiom is preserved verbatim. DEFERRED cross-class boundaries, all faithful-noops and none carrying arithmetic: apply()'s FontManager buy-label push and the GameMIDlet MIDlet-Version version-line assembly, the StringTable.instance.locales initializer, and the System.out.println locale trace. locale_index (StringTable.instance.localeIndex) is threaded in as a param. One-sided nodes are javac modifiers/super/parenthesized (erased), the deferred boundaries (faithful-noop), and the four Rust-only helper/const definitions (representation-adapters)."
