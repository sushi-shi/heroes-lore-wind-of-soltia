  { category = "representation-adapter", reason = "EntityArena::nodes field decl (Vec<EntityNode>): the Rust-only shared-Entity-heap seam that stands in for the not-ported Entity object graph; no Java node", rust = ["6:0", "6:1", "6:2"] },
  { category = "representation-adapter", reason = "impl EntityArena::new — the Rust-only empty-arena constructor (the entity heap has no Java analogue in aq)", rust_range = [{ target = 8, start = 0, end = 6 }] },
  { category = "representation-adapter", reason = "impl EntityArena::spawn — the Rust-only node allocator standing in for `new Entity(...)` (pushes an EntityNode, returns its EntityId); aq never constructs entities, so it is one-sided", rust_range = [{ target = 9, start = 0, end = 22 }] },
  { category = "representation-adapter", reason = "impl EntityArena::node — the Rust-only shared read accessor into the slab; the reads it serves pair inside the method ops", rust_range = [{ target = 10, start = 0, end = 7 }] },
  { category = "representation-adapter", reason = "impl std::ops::Index for EntityArena — the Rust-only `arena[id]` shared-borrow accessor; no Java node", rust_range = [{ target = 11, start = 0, end = 7 }] },
  { category = "representation-adapter", reason = "impl std::ops::IndexMut for EntityArena — the Rust-only `arena[id]` mutable-borrow accessor; no Java node", rust_range = [{ target = 12, start = 0, end = 7 }] },
  { category = "representation-adapter", reason = "impl EntityListState::new (= Self::default()) — the idiomatic Rust representation of `new EntityList()`; the field values pair to derive Default above", rust_range = [{ target = 17, start = 0, end = 3 }] },
  { category = "representation-adapter", reason = "fn depth(arena, id) = (halfH as i32).wrapping_add(pixel_y as i32): the Rust-only foot-line helper, DEFINED once but CALLED at each use so the eight iadds are never hoisted (the depth() call sites pair inside the guard/loop ops); byte/short sign-extend to int via `as i32` before the add", rust_range = [{ target = 18, start = 0, end = 18 }] },
  { category = "representation-adapter", reason = "remove(): the hoisted `let node_next = arena[node].next` and `let node_prev = arena[node].prev` locals — Rust reads each once to satisfy borrow rules, then uses them in both branch matches (Java re-reads node.next/node.prev inline in each branch, which pair inside the two if/else ops)", rust = ["21:53", "21:54", "21:55", "21:56", "21:57", "21:58", "21:59", "21:60", "21:61", "21:62", "21:63", "21:64", "21:65", "21:66"] },
