review = "Table-driven CRC-32 (ISO 3309 / zlib variant, reversed polynomial 0xEDB88320), crosswalked node-for-node (135 Java / 204 Rust nodes, each decided exactly once). Two representation shapes dominate. (1) `private static final int[] TABLE = new int[256]`, built eagerly in <clinit>, becomes a lazily-initialized `fn table() -> &'static [i32;256]` backed by OnceLock: the field declaration + its declared `new int[256]` are representation-adapter, the OnceLock scaffold and the closure's tail `t` are Rust-only representation-adapter, and the real 256-int allocation pairs the <clinit>-folded `new int[256]` against `let mut t = [0i32;256]` — observationally equivalent (built once before first use; deterministic pure table). (2) `private int crc = -1` seeds through the field-initializer + synthetic <init> into `impl Default { Crc32State { crc: -1 } }`, with the idiomatic new() wrapper adapted, exactly as Adler32. OPERATOR PARITY: every Java UNSIGNED_RIGHT_SHIFT is realized by j2me_jvm::iushr — `this.crc >>> 8` in update() and the two `c >>> 1` arms of the <clinit> ternary — so the parity teeth are satisfied by genuine unsigned-shift helpers (no shape_note, no blanket). The two C-style `for` loops are lowered to `while` with explicit init/step; `short n`/`byte bit` widen with `as i32` for their `< 256`/`< 9` tests and narrow back via `(… as i16)`/`(… as i8)` on the step, faithful to Java short/byte arithmetic-in-int. update()'s single Java statement is split so the TABLE index `(this.crc ^ data[i]) & 255` is hoisted into `let idx` (baload sign-extends the byte, `& 255` re-zero-extends); `length + offset` and `i++` use wrapping_add (faithful signed wrap); `data[i]` is unguarded, so a Rust panic on a bad index is the faithful uncaught ArrayIndexOutOfBoundsException. PRESERVED AS-IS: the `& 16777215` (0x00FFFFFF) after `>>> 8` is redundant (the unsigned shift already zeroes the top byte) yet kept verbatim; the reversed polynomial `-306674912` (0xEDB88320) and the `-1` seed/complement are Java single INT_LITERALs realized as Rust UNARY `-` on the positive literal."
