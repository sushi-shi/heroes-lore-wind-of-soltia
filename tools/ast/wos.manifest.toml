review = "Equipment extends Item (e extends ad) — the equippable base (value/levelReq/identify + a four-slot enchant), crosswalked node-for-node (348 Java / 433 Rust nodes, each decided exactly once). parseRecord chains the base Item parser then parseEquipStats; the base name/desc/price parser ignores rollEnchants, so the Rust `parse_record_base` omits that parameter and the Java argument is one-sided (erased). parseEquipStats decodes value = (short)(data[offset] & 255) (TYPE_CAST short -> `as i16`, AND -> `&`), the level/identify bytes, scans the eight enchant-range bytes (a `for` -> init + while + tail increment), and when rolling is due builds the mins/maxs `new byte[]{...}` literals — the port HOISTS these into `let mins`/`let maxs: [i8;4]` locals, so each inline Java array literal pairs to its hoisted Rust binding, and every rangeBase + k index is realized by wrapping_add + `as usize`. serialize writes the identify/refine bytes (the `?:` ternary -> an if/else expression) and System.arraycopy(enchant,0,out,5,4) -> out[5..9].copy_from_slice(&enchant[0..4]). rollEnchant's while(true) becomes a `loop` bound to `let slot` (the (true) guard is a faithful-noop), with slot = randRange -> a fresh `let s` broken out of the loop, and the (byte) casts on rolled values -> `as i8`. No divides or shifts anywhere; every Java int `+` is realized by wrapping_add. One-sided nodes: modifiers (erased), the six instance fields flattened onto the shared Item struct (representation-adapter, declared in item.rs), the Java constructor incl. this.enchant = new byte[4] (representation-adapter — the flattened Item is built elsewhere), the dropped rollEnchants base-parser argument (erased), the if-condition parens (erased), and the (true) inner-loop guard (faithful-noop)."
