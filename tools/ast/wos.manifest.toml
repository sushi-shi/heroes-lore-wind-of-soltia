review = "StringTable: the localized-string table loader/decoder, crosswalked node-for-node (386 Java / 652 Rust nodes). This increment realizes the title-footer path — `load` (open lang/language.<suffix>, read the u32 payload header, slurp the body) and `get` (offset-table lookup + modified-UTF-8 record decode) — and is honest about what is DEFERRED and what is HOST plumbing. DEFERRED (erased, Java-only, not transliterated): the whole `resolveLocale` method and load's `if (index < 0)` resolveLocale branch (the title path calls load with index >= 0); represented as deferral, never as realized. HOST-ADAPTERS (Rust-only reimplementations of java.io.DataInputStream absent from the oracle): `read_int_be` (readInt, its `<<24/16/8` shifts), `read_int_be_checked` (bounds-checked readInt == EOFException as None) and `read_utf` (readUTF modified-UTF-8 decoder, its `<<6/<<12` assembly shifts) — those shifts live in adapt, not in any paired op, while the readInt/readUTF CALL SITES pair inside load/try_get. Operator parity where it bites: `get`'s `stream.skip(id << 2)` is realized by j2me_jvm::ishl (LEFT_SHIFT). PRESERVED DEFECT (representation-adapter, Rust-only): `let id = id - 0` keeps the redundant `iload_1;iconst_0;isub` identity the reconstructed Java elided. REPRESENTATION differences noted honestly: the process-wide `instance` singleton becomes Game-owned state (erased); the `stream` field is modelled by indexing `blob` directly (erased, no stream construction); the IOException catch is subsumed by an unwrap_or_else panic; the do-while read loop is realized as a pre-tested while with explicit want/avail/min modeling of `in.read`'s partial-read count; the catch diagnostic is a fixed `{id}.error` placeholder that drops the exception text. Dead obfuscator locals (the constructor's UI labels and the static block's language names) are erased."
