  { category = "erased", reason = "redundant javac PARENTHESIZED grouping around the yieldTick `loadProgress % 6 == 0` if-condition; Rust carries it unparenthesized", java = [901] },
  { category = "faithful-noop", reason = "the yieldTick try { Thread.sleep(50L); } catch(InterruptedException){} (TRY/BLOCK/EXPRESSION_STATEMENT/METHOD_INVOCATION/MEMBER_SELECT/IDENTIFIER/LONG_LITERAL/CATCH/VARIABLE/type/BLOCK): every-sixth-call CPU yield with no observable state; the port renders it as an empty block, preserving only the loadProgress increment/modulo above", java = [908, 909, 910, 911, 912, 913, 914, 915, 916, 918, 919] },
  { category = "erased", reason = "javac MODIFIERS metadata for the caught `InterruptedException unused` variable in yieldTick; Rust binds no exception value", java = [917] },
  { category = "erased", reason = "javac's <clinit>-folded re-materialization of the static field initializers keepLoadingProgress=false / loadProgress=0 / loadTotal=100 / loadPhase=0 (BOOLEAN_LITERAL + three INT_LITERALs): paired to the Default FIELD_INITs above, so the folded copies are one-sided", java = [920, 921, 922, 923] },
  { category = "faithful-noop", reason = "r.<clinit>'s explicit static{} block: two dead local int[] tables (iArr = {5,5,...}, iArr2 = {0,4,...}) allocated and immediately discarded with no field write or side effect — a no-op the port drops entirely (VARIABLE/MODIFIERS/ARRAY_TYPE/PRIMITIVE_TYPE/NEW_ARRAY + 52 INT_LITERALs)", java_range = [[924, 986]] },
