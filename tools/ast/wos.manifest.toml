review = "TitleScreen (obf `bg`), the pixel-verified title/intro BaseCanvas, crosswalked node-for-node (1328 Java / 1329 Rust nodes, each decided exactly once). PORTED: the constructor (implicit super BaseCanvas() realized as the Canvas + ARGB framebuffer materialization then base_canvas::construct); paint's full state machine — the dispatcher (match on state, the setViewHeight prologue realized from the framebuffer height, the throttle epilogue), the state-1 title branch (paint_title: white clear, titleBgFrames[2..4] logo art, the orange versionText, the two ping-pong fluttering birds from titleMenuFrames, the RNG-driven glyph position/frame state machine, and the blinking PRESS ANY KEY footer) and the state-10 logo branch (paint_logo: logoFrames[4] slide, the frame state machine); startLogo; startTitle; keyPressed (the state machine: any key on state 1 -> enterStoryMode); enterStoryMode (the progressFlags resume test, executed synchronously into run); and run's state-0/loadPhase-2 main-menu loader. OPERATOR PARITY: every Java DIVIDE (`width/2` in the two title respawns and in startTitle x2; `(halfH-animTick)/2` in paint_logo) is realized by java_div, and the single REMAINDER (`animTick%4`) by java_rem — each kept in the same op as its Java node; MULTIPLY/PLUS/MINUS/`&` are not parity kinds (realized by wrapping_mul/add/sub and `&`). REPRESENTATION (Rust-only): reference field `instance` is a bool presence flag; paint_title/paint_logo extract the two switch-case bodies into fns with disjoint field-borrow destructures, a `should_start_title` bool binding, and re-acquired framebuffer Graphics device handles (host-adapter); the match arms carry `_ => {}` completeness arms the Java switch lacks; enter_story_mode rebinds `resume` as mut. DEFERRED (erased, not ported in this slice): boot(), loadLanguage(), hideNotify()/showNotify(), the run() loadPhase-1 first-boot loader (loadGlobalUi/TextTable/RmsFile), and the audio/lifecycle/async statements inside ported methods (stopBgm/playBgm/stopSfx, destroyApp, the async Thread spawns, beginLoading, loadStringTables) — plus javac switch `break`s, MODIFIERS, folded field initializers, the discarded `new Object()` (faithful-noop), and the `\"*:MAP UPDATE\"` <clinit>."
