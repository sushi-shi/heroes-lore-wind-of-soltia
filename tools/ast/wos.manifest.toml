review = "The intrusive doubly-linked entity list kept sorted by draw depth, crosswalked node-for-node (454 Java / 774 Rust nodes, each decided exactly once). REPRESENTATION SHAPE (the dominant, honest asymmetry, rust > java): Entity (ck) is not ported, so a Java Entity reference becomes a slab index (EntityId), and the shared entity heap is the Rust-only EntityArena — a Vec<EntityNode> carrying exactly the fields aq reads/writes (next, prev, halfH, pixelY, removed). All of EntityNode/EntityArena (its field decls, new/spawn/node/Index/IndexMut) plus EntityListState::new and the depth() helper are representation-adapter (no Java AST node); node.equals(target) — Object identity, Entity overrides nothing — becomes index equality `id == target`. The three list fields head/tail map to Option<EntityId>, count to i32; their null/0 initializers (decl-site + <init>-folded) are materialized by #[derive(Default)], a derive macro with no AST node. depth(node) = `node.halfH + node.pixelY` is the foot line; it is RECOMPUTED at every use, never hoisted, so the method's iadd multiset is preserved (byte and short both promote to int before the add — one iadd per sum). count++/count-- are realized by wrapping_add/wrapping_sub (iadd/isub); there are NO divides, remainders, or shifts anywhere, so the operator-parity tooth never fires. The Java while(true){...break...} search/scan loops are lowered to Rust loop+match on the Option (the null sentinel is the None arm); each null-check + branch (`if (x.prev != null) ... else ...`) becomes a match on a hoisted Option local, and Java's null-early-return `if (node==null) return null` becomes the `?` operator. TWO PRESERVED DEFECTS, reproduced verbatim (NOT fixed): (1) COUNT-INFLATION (EntityList.java:112 / :140, byte-verified against javap -c -p aq.class — reorderByDepth has only the eight depth iadds, no isub/iinc on count): the method unlinks node from its old position WITHOUT count--, then, when the node relocates all the way to an extreme end, calls addFront/addBack — each of which does count++, so every reorder that slides a node to the head or tail erroneously inflates count by one (node total unchanged; the counter over-counts); a mid-list splice leaves count correct. Represented in the addFront/addBack branch ops. (2) ASYMMETRY: the toward-tail branch sets `node.removed = true` (before unlinking); the toward-head branch does NOT. Represented in the node.removed=true op. One-sided Java nodes: field modifiers + local-var modifiers (erased), the synthetic super-constructor (erased), the null/0 field initializers (representation-adapter via derive Default), and the explicit `return` after the tail-ward addBack (faithful-noop — it is the Rust fn's implicit tail)."
