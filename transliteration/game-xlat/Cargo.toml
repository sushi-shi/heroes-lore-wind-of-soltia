[package]
name = "heroes-lore-wind-of-soltia-game-xlat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The strict transliteration of Heroes Lore: Wind of Soltia (J2ME) — provably the same program as the recovered Java."
publish = false

# The STRICT transliteration of Heroes Lore: Wind of Soltia (J2ME). This crate
# exists to be *provably the same program* as the recovered Java — the
# executable spec — NOT good Rust. Do not refactor it. It depends only on the
# JVM-primitive and device-runtime layers below it (the shared `j2me-*` crates).
[dependencies]
j2me-jvm = { workspace = true }
j2me-me = { workspace = true }

# Test-only. The cross-check oracles ("two implementations, one truth") diff the
# transliterated decoders against INDEPENDENT references over real blobs pulled
# from `_originals/…v207.jar`:
#   - `heroes-lore-wind-of-soltia-formats` is the separately-reversed `.mpd`/`.mph`
#     parser (the second implementation the PngMerger reconstruction is checked
#     against).
#   - `zip` extracts the atlas blobs from the baseline JAR at test time (workspace
#     pin; deflate-only, offline).
#   - `png` re-decodes every reconstructed frame — the liveness proof that the
#     reassembled bytes are a valid PNG.
[dev-dependencies]
heroes-lore-wind-of-soltia-formats = { path = "../../crates/formats" }
zip = { workspace = true }
png = { workspace = true }
