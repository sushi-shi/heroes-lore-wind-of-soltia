# Workspace root for the Heroes Lore: Wind of Soltia native (Rust) port.
#
# The shared foundation is the canonical `j2me-*` crate family published from
# j2me-preservation-kit and pinned below to one immutable commit:
# `j2me-jvm` (Java integer/JVM semantics), `j2me-canvas` (a neutral 2D ARGB
# buffer), `j2me-me` (the Java ME/MIDP device runtime), and `j2me-codec` (no_std
# bounded readers). The per-game work sits on top: `crates/formats`
# (`heroes-lore-wind-of-soltia-formats`, malformed-input-rejecting parsers for the
# game's custom resource formats) and `transliteration/game-xlat`
# (`heroes-lore-wind-of-soltia-game-xlat`, the strict transliteration), plus the
# native host (`apps/heroes-lore-wind-of-soltia-linux`).
[workspace]
members = [
    "transliteration/game-xlat",
    "crates/formats",
    "apps/heroes-lore-wind-of-soltia-linux",
    # Audit tooling: the formatting-independent `syn` AST emitter for the
    # per-node Java/Rust crosswalk gate (tools/ast). Game-agnostic; adopted from
    # the j2me home `_template/tools/ast/`.
    "tools/ast/j2me-ast-audit",
]
exclude = [
    # Retained historical snapshots; active consumers use the immutable public
    # dependencies below, so these directories are evidence rather than shadow
    # copies in the build graph.
    "crates/j2me-canvas",
    "crates/j2me-codec",
    "crates/j2me-jvm",
    "crates/j2me-me",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"

# Foundational dependencies pinned here so one version is chosen across the whole
# workspace. Add them to a crate with `dep = { workspace = true }`.
[workspace.dependencies]
j2me-jvm = { git = "https://github.com/sushi-shi/j2me-preservation-kit.git", rev = "c4ee0943acd3aadb8c5c26f20f25941eb7cb43bc" }
j2me-me = { git = "https://github.com/sushi-shi/j2me-preservation-kit.git", rev = "c4ee0943acd3aadb8c5c26f20f25941eb7cb43bc" }
# Generic remappable physical-key -> Nokia-code mapping (presets + a `[keymap]`
# override table). Adopted by the native host so key remapping is configurable
# rather than the old hard-coded winit->Nokia table. Same kit rev as above.
j2me-input = { git = "https://github.com/sushi-shi/j2me-preservation-kit.git", rev = "c4ee0943acd3aadb8c5c26f20f25941eb7cb43bc" }
# `zip` is used only by the format/transliteration tests to extract resource
# blobs from the baseline JAR at test time. Deflate-only (no bzip2/zstd/aes) keeps
# the build pure-Rust and offline friendly — JAR entries are STORE or DEFLATE.
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
# `png` decodes the sprite PNGs to ARGB inside the device runtime's MIDP
# `Image.createImage(byte[])` factory (`j2me-me`). Pure-Rust, no C codec.
png = "0.17"
# Native host (apps/heroes-lore-wind-of-soltia-linux). `winit` owns the OS window + keyboard event
# loop; `softbuffer` blits our CPU ARGB framebuffer straight to the window (2D
# only — no wgpu/shaders). Default features are kept as upstream ships them so
# the host builds on a bare Linux box via dlopen'd X11/Wayland.
winit = "0.30"
softbuffer = "0.4"
# `quote` + `syn` back the `j2me-ast-audit` crate (tools/ast), the
# formatting-independent Rust AST emitter for the per-node crosswalk audit. The
# `full` + `visit` features give it the whole item/expr grammar and the visitor.
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[profile.release]
opt-level = 3

# Debug assertions catch the wrapping/overflow divergences the transliteration
# must reproduce faithfully — keep them on in dev so a stray native `+`/`<<`
# that should have gone through `j2me-jvm` trips a panic instead of hiding.
[profile.dev]
overflow-checks = true
